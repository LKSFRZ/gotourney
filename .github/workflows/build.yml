# Tests and builds the program for Windows, macOS and Linux.
# Every push: the archives are attached to the workflow run ("Artifacts").
# A tag like v0.3.0: additionally a GitHub release with the archives is created.
name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m pytest -q

  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: an older Linux base, so the program also runs on older distributions
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v6
        with:
          name: GoTournament-${{ matrix.os }}
          path: |
            dist/GoTournament-*.zip
            dist/GoTournament-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
