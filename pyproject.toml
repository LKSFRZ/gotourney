[project]
name = "gotourney"
version = "0.1.0"
description = "Command line tools for organising a TGoR Go tournament"
requires-python = ">=3.11"
dependencies = [
    "odfpy>=1.4",
    "networkx>=3.0",
    "typer>=0.12",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gotourney = "gotourney.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
