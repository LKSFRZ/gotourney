[project]
name = "gotourney"
version = "0.2.0"
description = "Command line tools for organising a TGoR Go tournament"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "odfpy>=1.4",
    "networkx>=3.0",
    "typer>=0.12",
    "requests>=2.31",
    "reportlab>=4.0",
    "flask>=3.0",
    "tomlkit>=0.12",
    "waitress>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["pyinstaller>=6", "pillow>=10"]

[project.scripts]
gotourney = "gotourney.cli:app"

[project.gui-scripts]
gotourney-app = "gotourney.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
gotourney = ["data/*.csv", "data/*.png", "data/fonts/*", "data/docs/*", "web/templates/*.html", "web/static/*"]
